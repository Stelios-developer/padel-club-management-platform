<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img" aria-labelledby="title desc"><title id="title">Padel Club system architecture</title><desc id="desc">Browser and Keycloak, API gateway, member subscription booking and access services, PostgreSQL outbox RabbitMQ notification flow, optional Spring AI Ollama pgvector assistant, and observability/testing layers.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152c"/><stop offset="1" stop-color="#123970"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#6f8eb1" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#acc0d9}.label{font-size:12px;font-weight:700;letter-spacing:2px}.title{fill:#f7fafc;font-weight:700}.line{stroke:#6f8eb1;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.node{fill:#112c4f;stroke:#375577;stroke-width:1.3}</style><rect width="1280" height="850" rx="24" fill="url(#bg)"/><rect width="1280" height="850" rx="24" fill="url(#grid)"/><text x="44" y="46" class="label" fill="#d9f846">SYSTEM DESIGN</text><text x="44" y="89" class="title" font-size="32">One member journey. Explicit service boundaries.</text><text x="44" y="117" class="muted" font-size="14">Read the booking path, the event path and the optional local AI path separately.</text><rect x="44" y="151" width="306" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="62" y="181" fill="#f1f6ff" font-size="17" font-weight="700">Web / Nginx</text><text x="62" y="205" fill="#acc0d9" font-size="12">Greek UI · members / reception / admin</text><rect x="44" y="280" width="306" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="62" y="310" fill="#f1f6ff" font-size="17" font-weight="700">API Gateway</text><text x="62" y="334" fill="#acc0d9" font-size="12">Spring Cloud Gateway · OAuth2 / JWT</text><rect x="405" y="151" width="250" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="423" y="181" fill="#f1f6ff" font-size="17" font-weight="700">Keycloak</text><text x="423" y="205" fill="#acc0d9" font-size="12">OIDC authorization code + PKCE</text><path class="line" d="M350 189H405"/><text x="365" y="172" class="muted" font-size="11">login</text><path class="line" d="M197 227V280"/><text x="212" y="258" class="muted" font-size="11">authenticated requests</text><rect x="405" y="280" width="250" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="423" y="310" fill="#f1f6ff" font-size="17" font-weight="700">Spring Cloud</text><text x="423" y="334" fill="#acc0d9" font-size="12">Config Server + Eureka discovery</text><path class="line" stroke-dasharray="5 5" d="M405 318H350"/><rect x="44" y="416" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="62" y="446" fill="#f1f6ff" font-size="17" font-weight="700">Members</text><text x="62" y="470" fill="#acc0d9" font-size="12">profiles / activation</text><path class="line" d="M197 356V388H182V416"/><rect x="350" y="416" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="368" y="446" fill="#f1f6ff" font-size="17" font-weight="700">Subscriptions</text><text x="368" y="470" fill="#acc0d9" font-size="12">plans / eligibility</text><path class="line" d="M197 356V388H488V416"/><rect x="656" y="416" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="674" y="446" fill="#f1f6ff" font-size="17" font-weight="700">Bookings</text><text x="674" y="470" fill="#acc0d9" font-size="12">courts / games / reception</text><path class="line" d="M197 356V388H794V416"/><rect x="962" y="416" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="980" y="446" fill="#f1f6ff" font-size="17" font-weight="700">Access</text><text x="980" y="470" fill="#acc0d9" font-size="12">check-in decisions</text><path class="line" d="M197 356V388H1100V416"/><text x="44" y="524" class="muted" font-size="13">Synchronous calls: OpenFeign + JWT relay. Each domain owns its persistence and Flyway migrations.</text><rect x="44" y="560" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="62" y="590" fill="#f1f6ff" font-size="17" font-weight="700">PostgreSQL</text><text x="62" y="614" fill="#acc0d9" font-size="12">booking constraints · idempotency</text><rect x="350" y="560" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="368" y="590" fill="#f1f6ff" font-size="17" font-weight="700">Transactional outbox</text><text x="368" y="614" fill="#acc0d9" font-size="12">atomic domain change + event</text><rect x="656" y="560" width="276" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="674" y="590" fill="#f1f6ff" font-size="17" font-weight="700">RabbitMQ</text><text x="674" y="614" fill="#acc0d9" font-size="12">publisher confirms · at-least-once</text><rect x="962" y="560" width="274" height="76" rx="12" fill="#112c4f" stroke="#375577"/><text x="980" y="590" fill="#f1f6ff" font-size="17" font-weight="700">Notifications</text><text x="980" y="614" fill="#acc0d9" font-size="12">deduplication · SMTP retry</text><path class="line" d="M320 598H350M626 598H656M932 598H962"/><path class="line" d="M794 492V542H182V560"/><rect x="721" y="151" width="250" height="76" rx="12" fill="#243c25" stroke="#9cb649"/><text x="739" y="181" fill="#ddf76c" font-size="17" font-weight="700">Optional assistant</text><text x="739" y="205" fill="#acc0d9" font-size="12">Spring AI · read-only HTTP tools</text><rect x="1001" y="151" width="235" height="76" rx="12" fill="#243c25" stroke="#9cb649"/><text x="1019" y="181" fill="#ddf76c" font-size="17" font-weight="700">Ollama + pgvector</text><text x="1019" y="205" fill="#acc0d9" font-size="12">local model + approved knowledge</text><path class="line" d="M971 189H1001"/><path class="line" d="M330 280V252H688V189H721"/><path class="line" stroke-dasharray="5 5" d="M846 227V396H794V416"/><text x="880" y="304" fill="#c7df7a" font-size="12">availability only</text><text x="880" y="324" fill="#acc0d9" font-size="12">member confirms booking</text><rect x="44" y="681" width="1192" height="120" rx="12" fill="#0b203a" stroke="#365276"/><text x="64" y="714" class="label" fill="#b4c8e1">CROSS-CUTTING ENGINEERING</text><text x="64" y="744" fill="#edf4fc" font-size="15">Resilience4j · OpenTelemetry · Prometheus / Grafana / Loki / Tempo</text><text x="64" y="773" class="muted" font-size="13">Testcontainers + API contracts · Playwright + axe · source/image scanning + SBOM tooling</text><text x="45" y="831" fill="#87a5c7" font-size="11">Conceptual topology: arrows summarize communication paths, not deployment replicas. Cloud and Kubernetes remain separate prepared scaffolds.</text></svg>
