<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="448" viewBox="0 0 1280 448" role="img" aria-labelledby="title desc"><title id="title">Padel Club — Java microservices and local AI</title><desc id="desc">A navy and lime technical portfolio banner combining a padel court with booking and event system nodes.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07152c"/><stop offset="1" stop-color="#123970"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".045"/></pattern><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="none" stroke="#6f8eb1" stroke-width="1.5"/></marker></defs><style>text{font-family:Arial,Helvetica,sans-serif}.muted{fill:#acc0d9}.label{font-size:12px;font-weight:700;letter-spacing:2px}.title{fill:#f7fafc;font-weight:700}.line{stroke:#6f8eb1;stroke-width:1.7;fill:none;marker-end:url(#arrow)}.node{fill:#112c4f;stroke:#375577;stroke-width:1.3}</style><rect width="1280" height="448" rx="24" fill="url(#bg)"/><rect width="1280" height="448" rx="24" fill="url(#grid)"/><path d="M24 1H1256" stroke="#cbea43" stroke-opacity=".7"/><circle cx="65" cy="61" r="7" fill="#d9f846"/><text x="84" y="65" class="label" fill="#d9f846">SOFTWARE ENGINEERING PORTFOLIO</text><text x="54" y="158" class="title" font-size="76" letter-spacing="-3">PADEL<tspan fill="#d9f846">.</tspan>CLUB</text><text x="57" y="226" fill="#edf4fc" font-size="35">Java microservices.</text><text x="57" y="269" fill="#edf4fc" font-size="35">Local intelligence.</text><text x="57" y="316" class="muted" font-size="17">Court bookings, club operations and the systems behind them.</text><rect x="56" y="357" width="143" height="36" rx="18" fill="#112e51" stroke="#365276"/><text x="127.5" y="380" text-anchor="middle" fill="#d4e1f2" font-size="12" font-weight="700">JAVA 21</