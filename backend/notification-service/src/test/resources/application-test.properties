spring.config.import=
spring.cloud.config.enabled=false
spring.cloud.config.import-check.enabled=false
eureka.client.enabled=false
spring.cloud.discovery.enabled=false
spring.datasource.url=jdbc:h2:mem:notification;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
padel.events.publish-enabled=false
padel.security.issuer=http://localhost:8081/realms/padel
padel.security.jwk-uri=http://localhost:8081/realms/padel/protocol/openid-connect/certs
spring.mail.host=localhost
spring.mail.port=1025
logging.level.root=WARN
management.health.mail.enabled=false
padel.mail.initial-delay=3600000
