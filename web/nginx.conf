server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Refresh Docker DNS when the gateway container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://api-gateway:8080;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    location /api/assistant/ { proxy_pass $gateway; proxy_set_header Host $host; proxy_read_timeout 130s; }
    location /api/ { proxy_pass $gateway; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_read_timeout 20s; }
    # Revalidate unversioned assets after a web deployment. Keep API caching separate.
    location / { expires -1; try_files $uri $uri/ /index.html; }
    location = /app-config.json { add_header Cache-Control no-store; }
}
