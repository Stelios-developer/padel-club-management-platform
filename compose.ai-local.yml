name: padel-ai-local

services:
  vector-db:
    image: pgvector/pgvector:0.8.7-pg17
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    environment:
      POSTGRES_DB: padel_assistant
      POSTGRES_USER: padel_assistant
      POSTGRES_PASSWORD_FILE: /run/secrets/ai_db_password
    secrets: [ai_db_password]
    ports: ["127.0.0.1:5544:5432"]
    volumes:
      - ai_pgdata:/var/lib/postgresql/data
      - ./infra/ai/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U padel_assistant -d padel_assistant"]
      interval: 5s
      timeout: 3s
      retries: 20

  ollama:
    image: ollama/ollama:0.35.0
    profiles: [models]
    restart: unless-stopped
    mem_limit: 3g
    cpus: 2.0
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
      OLLAMA_KEEP_ALIVE: 2m
    ports: ["127.0.0.1:11435:11434"]
    volumes: [ai_models:/root/.ollama]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 20

  assistant-service:
    profiles: [assistant]
    build: ./backend/assistant-service
    image: padel/assistant-service:local
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    ports: ["127.0.0.1:8085:8080"]
    secrets:
      - source: ai_db_password
        target: spring.datasource.password
    environment:
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx320m
      AI_DB_URL: jdbc:postgresql://vector-db:5432/padel_assistant
      OLLAMA_URL: http://ollama:11434
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-qwen3:0.6b}
      EUREKA_URL: http://discovery-server:8761/eureka/
      EUREKA_INSTANCE_HOSTNAME: assistant-service
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      BOOKING_URL: http://booking-service:8080
      KEYCLOAK_ISSUER: http://localhost:8081/realms/padel
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/padel/protocol/openid-connect/certs
      AI_KNOWLEDGE_DIRECTORY: /app/knowledge
      AI_KNOWLEDGE_MANIFEST: /app/knowledge-manifest.json
    volumes:
      - ./infra/ai/knowledge:/app/knowledge:ro
      - ./.runtime/ai-local/knowledge-manifest.json:/app/knowledge-manifest.json:ro
    networks: [default, padel]
    depends_on:
      vector-db: { condition: service_healthy }
    healthcheck:
      test:
        [
          CMD,
          wget,
          -q,
          -O,
          /dev/null,
          http://localhost:8080/actuator/health/liveness,
        ]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20

secrets:
  ai_db_password:
    file: ./.runtime/ai-local/db_password

volumes:
  ai_pgdata:
  ai_models:

networks:
  padel:
    external: true
    name: ${PADEL_NETWORK:-padel-club_default}
