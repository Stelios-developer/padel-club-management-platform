global:
  scrape_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: padel-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          [
            api-gateway:8080,
            member-service:8080,
            subscription-service:8080,
            booking-service:8080,
            access-service:8080,
            notification-service:8080,
          ]
    relabel_configs:
      - source_labels: [__address__]
        regex: "([^:]+):.*"
        target_label: service
        replacement: "$1"
