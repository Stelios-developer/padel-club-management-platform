{
  "apiVersion": "v1",
  "kind": "Namespace",
  "metadata": {
    "name": "padel"
  }
}
---
{
  "apiVersion": "v1",
  "kind": "Service",
  "metadata": {
    "name": "config-server"
  },
  "spec": {
    "selector": {
      "app": "config-server"
    },
    "ports": [
      {
        "port": 8888,
        "targetPort": 8888
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "config-server"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "config-server"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "config-server"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "config-server",
            "image": "padel/config-server:local",
            "ports": [
              {
                "containerPort": 8888
              }
            ],
            "env": [],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "memory": "768Mi",
                "cpu": "1000m"
              }
            },
            "volumeMounts": [
              {
                "name": "config",
                "mountPath": "/app/config-repo",
                "readOnly": true
              },
              {
                "mountPath": "/tmp",
                "name": "runtime-tmp"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/actuator/health",
                "port": 8888
              },
              "periodSeconds": 10,
              "failureThreshold": 36
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/actuator/health",
                "port": 8888
              },
              "periodSeconds": 15
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": 8888
              },
              "periodSeconds": 10
            },
            "securityContext": {
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "runAsGroup": 10001
            }
          }
        ],
        "volumes": [
          {
            "name": "config",
            "projected": {
              "sources": [
                {
                  "configMap": {
                    "name": "padel-config"
                  }
                },
                {
                  "secret": {
                    "name": "padel-spring-config"
                  }
                }
              ]
            }
          },
          {
            "name": "runtime-tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ],
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "automountServiceAccountToken": false
      }
    }
  }
}
