        "targetPort": 8080
      }
    ]
  }
}
---
{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "api-gateway"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "api-gateway"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "api-gateway"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "api-gateway",
            "image": "padel/api-gateway:local",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "CONFIG_SERVER_URL",
                "value": "http://config-server:8888"
              },
              {
                "name": "EUREKA_URL",
                "value": "http://discovery-server:8761/eureka/"
              },
              {
                "name": "DB_HOST",
                "value": "postgres"
              },
              {
                "name": "DB_USER",
                "value": "padel"
              },
              {
                "name": "SPRING_DATASOURCE_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "padel-secrets",
                    "key": "DB_PASSWORD"
                  }
                }
              },
              {
                "name": "RABBIT_HOST",
                "value": "rabbitmq"
              },
              {
                "name": "RABBIT_USER",
                "value": "padel"
              },
              {
                "name": "SPRING_RABBITMQ_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "padel-secrets",
                    "key": "RABBIT_PASSWORD"
                  }
                }
              },
              {
                "name": "KEYCLOAK_ISSUER",
                "value": "http://localhost:8081/realms/padel"
              },
              {
                "name": "KEYCLOAK_JWK_URI",
                "value": "http://keycloak:8080/realms/padel/protocol/openid-connect/certs"
              },
              {
                "name": "OTEL_SERVICE_NAME",
                "value": "api-gateway"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "memory": "768Mi",
                "cpu": "1000m"
              }
            },
            "volumeMounts": [
              {
                "mountPath": "/tmp",
                "name": "runtime-tmp"
              }
            ],
            "startupProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": 8080
              },
              "periodSeconds": 10,
              "failureThreshold": 36
            },
            "livenessProbe": {
              "httpGet": {
                "path": "/actuator/health/liveness",
                "port": 8080
              },
              "periodSeconds": 15
            },
            "readinessProbe": {
              "httpGet": {
                "path": "/actuator/health/readiness",
                "port": 8080
              },
              "periodSeconds": 10
            },
            "securityContext": {
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              },
              "allowPrivilegeEscalation": false,
              "readOnlyRootFilesystem": true,
              "runAsNonRoot": true,
              "runAsUser": 10001,
              "runAsGroup": 10001
            }
          }
        ],
        "volumes": [
          {
            "name": "runtime-tmp",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ],
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          }
        },
        "automountServiceAccountToken": false
      }
    }
  }
}
