{
  "apiVersion": "apps/v1",
  "kind": "Deployment",
  "metadata": {
    "name": "keycloak"
  },
  "spec": {
    "replicas": 1,
    "selector": {
      "matchLabels": {
        "app": "keycloak"
      }
    },
    "template": {
      "metadata": {
        "labels": {
          "app": "keycloak"
        }
      },
      "spec": {
        "containers": [
          {
            "name": "keycloak",
            "image": "quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c",
            "ports": [
              {
                "containerPort": 8080
              }
            ],
            "env": [
              {
                "name": "KC_BOOTSTRAP_ADMIN_USERNAME",
                "value": "admin"
              },
              {
                "name": "KC_BOOTSTRAP_ADMIN_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "padel-secrets",
                    "key": "KEYCLOAK_ADMIN_PASSWORD"
                  }
                }
              },
              {
                "name": "KC_DB",
                "value": "postgres"
              },
              {
                "name": "KC_DB_URL",
                "value": "jdbc:postgresql://postgres:5432/padel_identity"
              },
              {
                "name": "KC_DB_USERNAME",
                "value": "padel"
              },
              {
                "name": "KC_DB_PASSWORD",
                "valueFrom": {
                  "secretKeyRef": {
                    "name": "padel-secrets",
                    "key": "DB_PASSWORD"
                  }
                }
              },
              {
                "name": "KC_HOSTNAME",
                "value": "http://localhost:8081"
              },
              {
                "name": "KC_HTTP_ENABLED",
                "value": "true"
              },
              {
                "name": "KC_CACHE",
                "value": "local"
              },
              {
                "name": "KC_HEALTH_ENABLED",
                "value": "true"
              },
              {
                "name": "KC_METRICS_ENABLED",
                "value": "true"
              }
            ],
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "256Mi"
              },
              "limits": {
                "memory": "768Mi",
                "cpu": "1000m"
              }
            },
            "volumeMounts": [
              {
                "name": "realm",
                "mountPath": "/opt/keycloak/data/import",
                "readOnly": true
              },
              {
                "name": "login-theme",
                "mountPath": "/opt/keycloak/themes/padel",
                "readOnly": true
              },
              {
                "name": "runtime-tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "identity-data",
                "mountPath": "/opt/keycloak/data"
              },
              {
                "name": "keycloak-optimized",
                "mountPath": "/opt/keycloak/lib/quarkus",
                "readOnly": true
              }
            ],
            "args": [
              "start",
              "--optimized",
              "--import-realm"
            ],
            "securityContext": {
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            }
          }
        ],
        "volumes": [
          {
            "name": "realm",
            "secret": {
              "secretName": "padel-realm"
            }
          },
          {
            "name": "login-theme",
            "projected": {
              "sources": [
                {
                  "configMap": {
                    "name": "padel-login-theme",
                    "items": [
                      {
                        "key": "padel-theme.properties",
                        "path": "login/theme.properties"
                      },
                      {
                        "key": "padel-theme.css",
                        "path": "login/resources/css/padel.css"
                      },
                      {
                        "key": "padel-court.svg",
                        "path": "login/resources/img/court.svg"
                      }
                    ]
                  }
                },
                {
                  "secret": {
                    "name": "padel-login-messages",
                    "items": [
                      {
                        "key": "padel-messages-el.properties",
                        "path": "login/messages/messages_el.properties"
                      }
                    ]
                  }
                }
              ]
            }
          },
          {
            "name": "runtime-tmp",
            "emptyDir": {
              "sizeLimit": "64Mi"
            }
          },
          {
            "name": "identity-data",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          },
          {
            "name": "keycloak-optimized",
            "emptyDir": {
              "sizeLimit": "128Mi"
            }
          }
        ],
        "securityContext": {
          "seccompProfile": {
            "type": "RuntimeDefault"
          },
          "fsGroup": 1000,
          "fsGroupChangePolicy": "OnRootMismatch"
        },
        "automountServiceAccountToken": false,
        "initContainers": [
          {
            "name": "seed-keycloak-build",
            "image": "quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c",
            "command": [
              "/bin/sh",
              "-ec",
              "cp -R /opt/keycloak/lib/quarkus/. /work/quarkus/"
            ],
            "securityContext": {
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "50m",
                "memory": "32Mi"
              },
              "limits": {
                "cpu": "100m",
                "memory": "96Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "keycloak-optimized",
                "mountPath": "/work/quarkus"
              }
            ]
          },
          {
            "name": "optimize-keycloak",
            "image": "quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c",
            "command": [
              "/opt/keycloak/bin/kc.sh",
              "build",
              "--db=postgres",
              "--health-enabled=true",
              "--metrics-enabled=true"
            ],
            "env": [
              {
                "name": "JAVA_OPTS_APPEND",
                "value": "-Xms32m -Xmx256m -XX:ActiveProcessorCount=2"
              }
            ],
            "securityContext": {
              "readOnlyRootFilesystem": true,
              "allowPrivilegeEscalation": false,
              "runAsNonRoot": true,
              "runAsUser": 1000,
              "runAsGroup": 1000,
              "capabilities": {
                "drop": [
                  "ALL"
                ]
              }
            },
            "resources": {
              "requests": {
                "cpu": "100m",
                "memory": "128Mi"
              },
              "limits": {
                "cpu": "1000m",
                "memory": "512Mi"
              }
            },
            "volumeMounts": [
              {
                "name": "keycloak-optimized",
                "mountPath": "/opt/keycloak/lib/quarkus"
              },
              {
                "name": "runtime-tmp",
                "mountPath": "/tmp"
              },
              {
                "name": "identity-data",
                "mountPath": "/opt/keycloak/data"
              }
            ]
          }
        ]
      }
    }
  }
