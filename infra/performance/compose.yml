name: padel-performance
x-app: &app
  image: eclipse-temurin:21-jdk-alpine
  entrypoint:
    [java, -Xms64m, -Xmx256m, -XX:+ExitOnOutOfMemoryError, -jar, /app/app.jar]
  cpus: 1.0
  mem_limit: 768m
  environment: &environment
    SPRING_PROFILES_ACTIVE: test
    SPRING_CONFIG_IMPORT: ""
    SPRING_CONFIG_ADDITIONAL_LOCATION: file:/config/application.yml,file:/config/performance.yml
    SPRING_CLOUD_CONFIG_ENABLED: "false"
    DB_HOST: postgres
    DB_USER: performance
    DB_PASSWORD: isolated-performance-only
    KEYCLOAK_ISSUER: http://localhost:9081/realms/performance
    KEYCLOAK_JWK_URI: http://keycloak:8080/realms/performance/protocol/openid-connect/certs
  depends_on:
    postgres: { condition: service_healthy }
    keycloak: { condition: service_started }
  healthcheck:
    test:
      [
        CMD-SHELL,
        "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness",
      ]
    interval: 5s
    timeout: 3s
    start_period: 90s
    retries: 30
services:
  postgres:
    image: postgres:17-alpine
    cpus: 1.0
    mem_limit: 256m
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=50]
    environment:
      POSTGRES_USER: performance
      POSTGRES_PASSWORD: isolated-performance-only
    volumes:
      - benchmark-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U performance -d performance"]
      interval: 3s
      timeout: 3s
      retries: 30
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    cpus: 1.0
    mem_limit: 512m
    command: [start-dev, --import-realm]
    environment:
      KC_HOSTNAME: http://localhost:9081
      JAVA_OPTS_KC_HEAP: -Xms64m -Xmx192m
    ports: ["127.0.0.1:9081:8080"]
    tmpfs: [/opt/keycloak/data]
    volumes: ["./realm.json:/opt/keycloak/data/import/performance.json:ro"]
  member-service:
    <<: *app
    environment:
      <<: *environment
      SPRING_APPLICATION_NAME: member-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padel_members
    ports: ["127.0.0.1:9082:8080"]
    volumes:
      - ../../.runtime/performance/member.jar:/app/app.jar:ro
      - ../../backend/config-repo/application.yml:/config/application.yml:ro
      - ./application.yml:/config/performance.yml:ro
  subscription-service:
    <<: *app
    environment:
      <<: *environment
      SPRING_APPLICATION_NAME: subscription-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padel_subscriptions
    volumes:
      - ../../.runtime/performance/subscription.jar:/app/app.jar:ro
      - ../../backend/config-repo/application.yml:/config/application.yml:ro
      - ./application.yml:/config/performance.yml:ro
  booking-service:
    <<: *app
    environment:
      <<: *environment
      SPRING_APPLICATION_NAME: booking-service
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/padel_bookings
      SPRING_FLYWAY_LOCATIONS: classpath:db/migration,classpath:db/postgresql
    ports: ["127.0.0.1:9080:8080"]
    volumes:
      - ../../.runtime/performance/booking.jar:/app/app.jar:ro
      - ../../.runtime/performance:/results
      - ../../backend/config-repo/application.yml:/config/application.yml:ro
      - ./application.yml:/config/performance.yml:ro
      - ./performance.jfc:/config/performance.jfc:ro
  k6:
    image: grafana/k6:2.3.0
    profiles: [load]
    user: "0"
    cpus: 1.0
    mem_limit: 256m
    volumes:
      - ../../.runtime/performance:/results
      - ./:/scripts:ro
volumes:
  benchmark-data:
