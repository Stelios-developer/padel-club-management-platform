name: Cloud read-only Terraform plan
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: cloud-plan
  cancel-in-progress: false
jobs:
  plan:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && vars.CLOUD_PLAN_ENABLED == 'true'
    environment: cloud-plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_expected_account_id: ${{ vars.AWS_ACCOUNT_ID }}
      TF_VAR_region: ${{ vars.AWS_REGION }}
      TF_VAR_availability_zone: ${{ vars.AWS_AVAILABILITY_ZONE }}
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_bucket_name: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_state_kms_key_arn: ${{ vars.TF_STATE_KMS_KEY_ARN }}
      TF_VAR_existing_oidc_provider_arn: ${{ vars.AWS_GITHUB_OIDC_PROVIDER_ARN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - run: node scripts/security-install.mjs terraform
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-duration-seconds: 900
          mask-aws-account-id: true
      - name: Initialize protected remote state
        run: |
          set -euo pipefail
          .tools/security/terraform/terraform -chdir=infra/cloud/demo init -input=false -lockfile=readonly \
            -backend-config="bucket=$TF_VAR_state_bucket_name" \
            -backend-config="region=$TF_VAR_region" \
            -backend-config="key=padel/demo/terraform.tfstate" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true" \
            -backend-config="kms_key_id=$TF_VAR_state_kms_key_arn"
      - name: Refresh-only drift assessment (never apply)
        run: .tools/security/terraform/terraform -chdir=infra/cloud/demo plan -refresh-only -input=false -lock-timeout=60s
      # Raw state/plan files are deliberately not uploaded.
