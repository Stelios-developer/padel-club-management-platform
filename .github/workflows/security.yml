name: Security and supply chain
on:
  workflow_call:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - run: node scripts/security-install.mjs
      - run: .tools/security/actionlint/actionlint
      - run: node --test scripts/security/*.test.mjs scripts/verify-release.test.mjs
      - name: Populate Maven dependency metadata before POM scan
        env: { MAVEN_OPTS: "-Xmx512m" }
        run: mvn -B install -DskipTests
      - run: node scripts/security-scan.mjs source
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-source
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
          path: |
            .runtime/security/source.gate.json
            .runtime/security/source.cdx.json
  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build: manual
          - language: javascript-typescript
            build: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.build == 'manual'
        with: { distribution: temurin, java-version: "21", cache: maven }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build }}
          queries: security-extended
          config-file: ./.github/codeql/config.yml
      - name: Trace a clean Java build
        if: matrix.build == 'manual'
        env: { MAVEN_OPTS: "-Xmx512m" }
        run: mvn -B clean package -DskipTests
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: /language:${{ matrix.language }}
          output: .runtime/security/codeql
      - name: Enforce high/critical CodeQL findings
        env:
          LANGUAGE: ${{ matrix.language }}
        run: |
          set -euo pipefail
          found=0
          for report in .runtime/security/codeql/*.sarif; do
            [ -f "$report" ] || continue
            found=1
            node scripts/security-policy.mjs sarif "$report" ".runtime/security/codeql-$LANGUAGE.gate.json"
          done
          [ "$found" -eq 1 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: codeql-${{ matrix.language }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .runtime/security/codeql/*.sarif
            .runtime/security/codeql-*.gate.json
